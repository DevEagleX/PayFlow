# Local development database only - not a production deployment config.
# Unlike the old MongoDB setup, Postgres transactions work out of the box
# here with zero extra configuration (no replica-set initialization step).
services:
  postgres:
    image: postgres:16-alpine
    container_name: paytab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paytab
      POSTGRES_USER: paytab
      POSTGRES_PASSWORD: paytab_local_password
    ports:
      - "5432:5432"
    volumes:
      - paytab_postgres_data:/var/lib/postgresql/data

volumes:
  paytab_postgres_data:
