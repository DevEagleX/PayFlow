server:
  port: 8080

spring:
  application:
    name: paytab-backend
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema (see db/migration). Hibernate only validates
      # that entity mappings match what's actually in the database - it
      # never generates or alters schema itself. This is the standard
      # production setup: "update"/"create" are fine for quick experiments
      # but dangerous to leave on for anything real.
      ddl-auto: validate
    # Disables Open Session In View. Our sender/receiver associations on
    # Transaction are LAZY on purpose, and every service fully resolves
    # what it needs into DTOs before returning - so there's no code relying
    # on lazy-loading happening outside a transaction. Turning OSIV off is
    # the recommended production setting; leaving it on hides that kind of
    # bug until it shows up as a LazyInitializationException in prod.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
